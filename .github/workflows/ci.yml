name: Fork CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: collate-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  gate:
    name: Workspace quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      - name: Install Rust tooling
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
      - name: Simulate upstream integration
        run: |
          bash tools/fork/test-upstream-sync.sh
          bash tools/fork/test-upstream-publish.sh
      - name: Run repository quality gates
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo xtask ci
          cargo tree --locked -p designcraft --features sparkle --target all --edges normal --prefix none > "$RUNNER_TEMP/collate-deps.txt"
          if rg -q '^craft-update ' "$RUNNER_TEMP/collate-deps.txt"; then
            echo "::error::Collate may only update through its fork-owned Sparkle configuration."
            exit 1
          fi
          bash tools/fork/test-document-roundtrip.sh
          git diff --exit-code -- Cargo.lock

  macos:
    name: macOS application
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
      - name: Build unsigned desktop application
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo build --locked -p designcraft
      - name: Verify encrypted Keychain recovery
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: >-
          cargo test --locked -p designcraft-collab-core --features secure-journal
          --lib journal::tests:: -- --include-ignored
      - name: Verify the shared room survives a process restart
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: >-
          cargo test --locked -p designcraft-ui-egui --lib
          collaboration::tests::restart::native_room_recovery_reconnects_after_process_exit
          -- --ignored --exact
      - name: Smoke-test the bundled Sparkle updater
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          CODESIGN_BUILD_PROFILE: debug
          CODESIGN_UPDATE_FEED: https://updates.example.invalid/stable/appcast.xml
          CODESIGN_SPARKLE_PUBLIC_KEY: "+KXPELklrHmCOimjQG+mlzrdQ3R1WepJunQ/BuNeKjI="
        run: |
          set -euo pipefail
          export SPARKLE_FRAMEWORK_PATH="$RUNNER_TEMP/sparkle"
          packaging/macos/codesign/fetch-sparkle.sh "$SPARKLE_FRAMEWORK_PATH"
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          bash tools/fork/test-release-appcast.sh
          packaging/macos/codesign/bundle.sh "$RUNNER_TEMP/sparkle-smoke" "$(uname -m)"
          packaging/macos/codesign/sign-bundle.sh adhoc "$RUNNER_TEMP/sparkle-smoke" "$RUNNER_TEMP/sparkle-smoke.zip"
          "$RUNNER_TEMP/sparkle-smoke/Collate.app/Contents/MacOS/Collate" --check-updater-configuration
